方。</li></ul><h4>三、使用规范</h4><ul><li>不得利用平台从事违法违规活动。</li><li>不得以自动化方式非正常地大量抓取或干扰平台正常运行。</li><li>不得擅自公开或传播因使用平台而获知的他人数据。</li></ul><h4>四、服务变更与中断</h4><p>因升级维护、设备故障或不可抗力等原因，服务可能暂时中断；平台将尽合理努力提前告知并尽快恢复。</p><h4>五、协议变更</h4><p>条款更新后将在平台内公示，继续使用即视为接受更新后的条款。</p><div class="meta">示例文本版本：本地 v1.0</div>'}},Q9={version:"3.2",date:"2026-09-29"},Z9={service:{title:"用户服务协议",body:'<div class="note">以下为本地演示用的示例说明文本，<b>不是正式法律文件</b>，不能替代官方发布的用户服务协议。请以官方条款为准。</div><h4>一、协议的接受与变更</h4><p>本协议由你与三一重工股份有限公司（以下简称「我们」）就使用 MySANY 平台及相关服务所订立。你勾选同意即视为已充分阅读、理解并接受本协议全部条款。</p><p>我们可能会根据法律法规、业务调整等原因修订本协议。协议发生重大变更时，我们将通过平台弹窗、站内信等显著方式通知你；你需重新确认同意后方可继续使用相关服务，若你不同意变更内容，可选择停止使用。</p><h4>二、账号与安全</h4><p>你应妥善保管账号及密码。本次更新调整了账号安全与服务变更通知的条款表述：发生异常登录时，我们会通过手机号或邮箱向你发送提醒；服务发生重大变更的，我们将提前在平台内公示。</p><h4>三、服务内容</h4><p>我们向你提供设备管理、监控预警、保养计划、服务工单、机群报表等功能。部分功能需要你单独授权相应的数据范围，你可以在「个人中心」中随时查看与撤回。</p><h4>四、使用规范</h4><p>你承诺不利用本服务从事违反法律法规、侵犯他人合法权益的行为，包括但不限于发布违法信息、恶意抓取数据、干扰服务正常运行等。</p><h4>五、免责与争议解决</h4><p>因不可抗力或第三方原因导致的服务中断，我们将及时公告并尽力恢复。本协议适用中华人民共和国法律，争议双方应友好协商，协商不成的提交我们住所地有管辖权的人民法院处理。</p><div class="meta">示例文本版本：本地 v3.2 · 2026-09-29 生效</div>'},privacy:{title:"隐私协议",body:'<div class="note">以下为本地演示用的示例说明文本，<b>不是正式法律文件</b>，不能替代官方发布的隐私政策。请以官方条款为准。</div><h4>本次更新摘要</h4><p>更新了第三方 SDK 共享清单及其隐私政策地址；明确了设备定位信息与工况数据的收集目的、使用范围与存储期限；新增撤回授权、注销账号与个人信息副本获取的操作指引。</p><h4>一、我们如何收集和使用个人信息</h4><ul><li>注册与登录：收集手机号码，用于创建账号、身份验证与安全风控。</li><li>设备管理：在你授权后收集设备定位、工况与故障数据，用于在线监控、保养提醒与故障诊断。</li><li>服务工单：收集你提交的联系方式与故障描述，用于派工与售后跟踪。</li></ul><h4>二、我们如何共享个人信息</h4><p>除获得你的单独同意或法律法规另有规定外，我们不会向第三方共享你的个人信息。与第三方 SDK 的共享情况详见《个人信息共享清单》。</p><h4>三、我们如何存储和保护个人信息</h4><p>个人信息存储于中华人民共和国境内，存储期限为实现处理目的所必需的最短时间。我们采取加密传输、访问控制、审计日志等措施保护信息安全。</p><h4>四、你的权利</h4><ul><li>在「个人中心」查询、复制、更正你的个人信息。</li><li>在「设置 › Cookies 设置」中撤回非必要的授权。</li><li>申请获取个人信息副本，或注销账号。</li></ul><h4>五、联系我们</h4><p>如有疑问，可拨打客服热线 400-887-8318，我们将在 15 个工作日内回复。</p><div class="meta">示例文本版本：本地 v3.2 · 2026-09-29 生效</div>'},share:{title:"个人信息共享清单",body:'<div class="note">以下为本地演示用的示例说明文本，<b>不是正式法律文件</b>。接入真实第三方服务后请替换为实际清单。</div><h4>
